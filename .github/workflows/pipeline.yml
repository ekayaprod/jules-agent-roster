---
name: Unified Pipeline

"on":
  push:
    branches: ["main", "master"]
    paths-ignore:
      - '**.md'
      - '.jules/**'
      - 'docs/**'
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * 3'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci && npm run build:roster && npm run test:unit && npm test
      - if: matrix.node-version != '18.x'
        uses: ./.github/actions/setup-playwright
      - if: matrix.node-version != '18.x'
        run: npx playwright test
      - if: always() && matrix.node-version != '18.x'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
      - if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        uses: actions/configure-pages@v6
      - if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        run: |
          mkdir _site
          cp -t _site/ roster-payload.json fusion_matrix.json index.html && cp -r js css prompts _site/
      - if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: ${{ github.event.pull_request.changed_files == 0 }}
        run: |
          echo "❌ ERROR: This pull request contains 0 changed files."
          echo "Empty pull requests are not allowed."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  update-orphans:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: node scripts/update-orphans.js
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prompts/fusions prompts/orphans
          if ! git diff --staged --quiet; then
            git commit -m "chore: update orphans lists and move unreferenced fusions"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi
