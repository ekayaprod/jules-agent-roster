---
name: Unified Pipeline

"on":
  push:
    branches: ["main", "master"]
    paths-ignore:
      - '**.md'
      - '.jules/**'
      - 'docs/**'
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Execute Validation Pipeline
        run: npm ci && npm run build:roster && npm run test:unit && npm test

      - name: Setup Playwright
        if: matrix.node-version != '18.x'
        uses: ./.github/actions/setup-playwright

      - name: Run E2E Tests
        if: matrix.node-version != '18.x'
        run: npx playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.3.4
        if: always() && matrix.node-version != '18.x'
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Isolate Production Payload
        if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        run: |
          mkdir _site
          cp -t _site/ roster-payload.json fusion_matrix.json index.html && cp -r js css prompts _site/

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
