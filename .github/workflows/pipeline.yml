---
name: Unified Pipeline

"on":
  push:
    branches: ["main", "master"]
    paths-ignore:
      - '**.md'
      - '.jules/**'
      - 'docs/**'
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Execute Validation Pipeline
        run: npm ci && npm run build:roster && npm run test:unit && npm test

      - name: Setup Playwright
        if: matrix.node-version != '18.x'
        uses: ./.github/actions/setup-playwright

      - name: Run E2E Tests
        if: matrix.node-version != '18.x'
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always() && matrix.node-version != '18.x'
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        uses: actions/configure-pages@v6

      - name: Isolate Production Payload
        if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        run: |
          mkdir _site
          cp -t _site/ roster-payload.json fusion_matrix.json index.html && cp -r js css prompts _site/

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
